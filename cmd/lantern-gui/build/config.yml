# Wails v3 project configuration for lantern-gui.
#
# Spike scope: `wails3 dev` only. It watches Go sources, copies the
# canonical page in, and runs the window. Production builds and packaging
# (`wails3 build` / `wails3 package`) are NOT wired yet — those need the
# full Taskfile scaffold from `wails3 init` (a future step).
version: '3'

info:
  companyName: "Lantern"
  productName: "Lantern"
  productIdentifier: "com.lantern.app"
  description: "Peer-to-peer file transfer"
  copyright: "(c) 2026, Lantern"
  comments: "Wails v3 desktop shell spike"
  version: "0.1.0-spike"

# Dev mode configuration. The canonical page lives at
# <repo>/frontend/dist/index.html, outside the watch root, so page edits
# need a dev restart; Go changes rebuild automatically. The copied page
# itself is ignored to avoid rebuild loops.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
      - frontend/dist/*
  watched_extension:
    - "*.go"
    - "*.html"
  git_ignore: true
  executes:
    - cmd: wails3 tool cp ../../frontend/dist/index.html frontend/dist/index.html
      type: blocking
    # production tag: serve the embedded page instead of waiting for a
    # Vite dev server (our page is static, so there isn't one).
    - cmd: go run -tags wails,production .
      type: primary
