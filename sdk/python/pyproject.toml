[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lantern-py"
version = "0.1.0"
description = "Thin zero-dependency client for lanternd, the Lantern transfer daemon"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["lantern_py*"]
