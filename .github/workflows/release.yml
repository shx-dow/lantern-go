name: Release

# Builds a GitHub release from a version tag, and can rehearse the same build
# from workflow_dispatch without publishing anything.
#
# Deliberately hand-rolled rather than delegated to a release action. A release
# action is a third-party dependency that runs with the repository token and
# decides what ends up in a published artifact; `gh` ships with the runner and
# this file is the whole of what happens. For a pre-alpha tool that is the
# better trade, and it is a trade that can be revisited when there is a
# maintainer to review a dependency's updates.
#
# The binaries are CGO-free. Every dependency is pure Go, so there is no
# toolchain to install per platform and no C library for a user to be missing.
#
# Permission is split by job. Everything that builds or checks an artifact runs
# with contents: read. Only the publish job gets contents: write, and a dry run
# never starts that job, so a rehearsal has no token that can create a release
# or move a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example v0.1.0-alpha.1"
        required: true
        type: string
      dry_run:
        description: "Build and verify only; do not create a release or tag"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  MODULE: github.com/shx-dow/lantern-go

jobs:
  # A tag that is not a commit on main is a mistyped or stale tag, and
  # publishing one is worse than failing. This runs before anything is built.
  #
  # A dispatch has no tag. It must name a version and point at a commit on
  # main, and with dry_run=true it stops after the artifacts are verified.
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and both candidate branches are needed for the ancestry
          # checks below.
          fetch-depth: 0

      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            source="tag push"
          else
            tag="$INPUT_VERSION"
            source="workflow_dispatch"
          fi

          if [[ "$tag" != v* ]]; then
            echo "::error::$source version $tag does not start with v"
            exit 1
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::$source version $tag is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            # Reachable from an origin branch, rather than only from some
            # commit that happens to exist. An unreferenced tag is a mistake
            # worth stopping for.
            found=no
            for ref in origin/main origin/release; do
              if git merge-base --is-ancestor "$SHA" "$ref" 2>/dev/null; then
                echo "tag $tag is on $ref"
                found=yes
                break
              fi
            done
            if [ "$found" = no ]; then
              echo "::error::tag $tag ($SHA) is not on main or release"
              exit 1
            fi
            publish=true
            mode="publish"
          else
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::dispatch commit $SHA is not on main"
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              publish=false
              mode="dry run, no release or tag will be created"
            else
              # A non-dry dispatch can retry a release, but it cannot mint a
              # tag. The tag must already exist and point at this commit, so
              # the workflow keeps the same tag-only publish rule as a push.
              if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "::error::tag $tag does not exist; dispatch only rehearses. Push the tag to publish."
                exit 1
              fi
              tag_commit="$(git rev-parse "$tag^{commit}")"
              if [ "$tag_commit" != "$SHA" ]; then
                echo "::error::tag $tag points at $tag_commit, not dispatched commit $SHA"
                exit 1
              fi
              publish=true
              mode="publish, using existing tag $tag at this commit"
            fi
            {
              echo "### Dispatch build"
              echo ""
              echo "- Version: \`$tag\`"
              echo "- Commit: \`$SHA\` (on main)"
              echo "- Mode: $mode"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # A version with a hyphen is a pre-release. The project is pre-alpha,
          # so those are expected rather than exceptional, and GitHub's
          # prerelease flag is what keeps them out of "latest release".
          #
          # Decided into a variable first and echoed once, because writing two
          # branches to two different files is how a prerelease flag ends up
          # unset on exactly the tags that need it.
          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "$source: building $version (prerelease=$prerelease, publish=$publish)"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # One failure should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      # The effective version, from the tag or the dispatch input. Never
      # github.ref_name unconditionally: on a dispatch that is a branch name.
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          # The extension is decided in the shell, not in a template.
          # GitHub expands expressions inside run blocks -- comments included --
          # and an inline conditional is not an expression: it is only valid as
          # the condition of an `if:` key. Writing one inline makes the whole
          # run block an unparseable template, and GitHub then fails the
          # workflow before any job starts, which is not a shape of failure a
          # CI run on a pull request would ever surface.
          #
          # (The same trap catches the comment above, which is why this one
          # spells the syntax out rather than writing it.)
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          go build -trimpath \
            -ldflags "-s -w \
              -X $MODULE/internal/version.Version=$VERSION \
              -X $MODULE/internal/version.Commit=$GITHUB_SHA \
              -X $MODULE/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${{ matrix.goos }}-${{ matrix.goarch }}/lantern${ext}" \
            ./cmd/lantern

      - name: Package
        run: |
          set -euo pipefail
          stage="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          base="lantern_${TAG}_${{ matrix.goos }}-${{ matrix.goarch }}"
          # README links to CONTEXT.md, SECURITY.md, and the files under docs/
          # with relative paths. Ship them so an unpacked archive is readable
          # offline. LICENSE alone was not enough, and the links resolved to
          # nothing in the download.
          cp LICENSE README.md SECURITY.md "$stage/"
          cp -R CONTEXT.md docs "$stage/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -q -r "$base.zip" "${{ matrix.goos }}-${{ matrix.goarch }}")
          else
            # The directory name inside the archive becomes the top-level
            # entry, so unpacking cannot scatter files into the cwd.
            tar -czf "dist/$base.tar.gz" -C dist "${{ matrix.goos }}-${{ matrix.goarch }}"
          fi
          ls -l dist

      # One step, both patterns, rather than one step per format.
      #
      # Windows produces only the zip and everything else only the tarball, so
      # two steps each guarded by if-no-files-found: error fails every matrix
      # job: each is missing the format it did not build, and with fail-fast
      # off that means six failures and a release job that is skipped. A single
      # step matching both patterns always finds at least one file, which is
      # what if-no-files-found actually asks.
      - uses: actions/upload-artifact@v4
        with:
          name: "lantern-${{ matrix.goos }}-${{ matrix.goarch }}"
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          # Long enough to retry a publish from the same run's artifacts,
          # rather than rebuilding and hoping the inputs were identical.
          retention-days: 7

  # Downloads every archive, checks the sums, and runs the binary that a user
  # would download. This job has no write token and runs on both paths.
  release:
    name: Verify artifacts
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # Only the archives, so the checksum file describes what a user
          # downloads rather than what this job happened to produce.
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Smoke-test archives
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist

          if ! sha256sum -c SHA256SUMS; then
            echo "::error::SHA256SUMS does not match the downloaded archives"
            exit 1
          fi

          shopt -s nullglob
          archives=(./*.tar.gz ./*.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "::error::expected 6 archives, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          for suffix in \
            linux-amd64.tar.gz linux-arm64.tar.gz \
            darwin-amd64.tar.gz darwin-arm64.tar.gz \
            windows-amd64.zip windows-arm64.zip; do
            if [ ! -f "lantern_${TAG}_${suffix}" ]; then
              echo "::error::missing archive lantern_${TAG}_${suffix}"
              exit 1
            fi
          done

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf "lantern_${TAG}_linux-amd64.tar.gz" -C "$tmp"
          top="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ -z "$top" ] || [ "$(find "$tmp" -mindepth 1 -maxdepth 1 | wc -l)" -ne 1 ]; then
            echo "::error::archive must contain exactly one top-level directory"
            find "$tmp" -mindepth 1 -maxdepth 1
            exit 1
          fi
          # The README links to these by relative path. A download that cannot
          # follow them is not the documentation the repository publishes.
          for f in \
            README.md LICENSE SECURITY.md CONTEXT.md \
            docs/daemon-api.md \
            docs/adr/0001-directory-push-expands-receiver-side.md \
            docs/adr/0002-new-pairings-default-to-read.md \
            docs/adr/0003-content-without-a-digest-is-refused.md; do
            if [ ! -f "$top/$f" ]; then
              echo "::error::archive is missing $f"
              exit 1
            fi
          done
          bin="$(find "$tmp" -type f -name lantern -print -quit)"
          if [ -z "$bin" ]; then
            echo "::error::linux-amd64 archive contains no lantern binary"
            exit 1
          fi

          out="$("$bin" version)"
          echo "lantern version: $out"
          prefix="$VERSION ($COMMIT, "
          if [[ "$out" != "$prefix"* ]]; then
            echo "::error::version output does not start with '$prefix': $out"
            exit 1
          fi
          rest="${out#"$prefix"}"
          build_date="${rest%%) *}"
          if ! [[ "$build_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T ]]; then
            echo "::error::build date is empty or not RFC 3339: '$build_date'"
            exit 1
          fi
          echo "artifact smoke test passed for $TAG at $COMMIT, built $build_date"

  # The only job with a write token. It is skipped unless the verify job said
  # publish=true, which for a dispatch means dry_run was explicitly false and
  # the tag already points at the dispatched commit.
  publish:
    name: Publish release
    needs: [verify, release]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Read this before the token is used. A dispatch with dry_run unset or
      # true must not reach gh, even if a future edit loosens the job
      # condition.
      - name: Refuse a dry run
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "false" ]; then
            echo "::error::refusing to publish: this dispatch is a dry run"
            exit 1
          fi
          echo "publish requested for $TAG"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh resolves the repository from a git remote, and this job has no
          # checkout, so it has none. The token authenticates; it does not say
          # which repository. Without this, gh release view finds nothing and
          # gh release create fails for the same reason.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          # --verify-tag is unconditional: a tag is the only thing this
          # workflow publishes. A dispatch may retry an existing tag, but it
          # never creates one.
          args=(--title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          # Named globs, not dist/*.
          #
          # dist/* is correct today only because download-artifact extracts
          # into an otherwise empty directory, so the only things in it are the
          # archives this job uploaded. That is an accident of the current
          # layout rather than a property anything states, and if anything else
          # ever lands there the glob hands gh a directory to upload. Caught by
          # running the extracted steps with the staging directories still
          # present -- which is exactly what dist/* picked up.
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          for a in "${assets[@]}"; do
            if [ ! -f "$a" ]; then
              echo "::error::missing release asset $a"
              exit 1
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run after a partial failure replaces the assets it already
            # published. Deleting the release instead would fail --verify-tag,
            # because --cleanup-tag removes the tag that triggered this run.
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${args[@]}" "${assets[@]}"
          fi
