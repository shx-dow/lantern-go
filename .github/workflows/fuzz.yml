name: Fuzz

# The targets here are where a peer chooses the input: a framing length, a
# nonce, a share code, a companion field. Nothing else in CI exercises them
# beyond their seed corpus, which is the right trade for a pull request and the
# wrong one for a codebase that has already had this class of defect.
#
# A crash is not the only result worth reporting. A target that stops finding
# anything for days has usually stopped being interesting, which is its own kind
# of problem: the corpus is pinned, and a change to the code under it may have
# made every stored input trivial.

on:
  schedule:
    # 03:17 UTC. GitHub starts scheduled runs from the top of the hour, and
    # :00 is the busiest slot for everyone. An arbitrary offset avoids the
    # queue without needing a reason.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long each target runs
        default: "10m"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.label }}
    # A schedule on a public repository is queued heavily at :00, and a job
    # that times out waiting is not a job. ubuntu-latest is also the only
    # platform where the whole corpus is affordable: Windows cannot hold a
    # name that is not valid UTF-8, so those inputs skip there anyway.
    runs-on: ubuntu-latest
    strategy:
      # Report every target, not just the first to fail.
      fail-fast: false
      matrix:
        # label is separate from package because an artifact name may not
        # contain a slash, and every package path here has one.
        include:
          - package: ./internal/protocol
            label: protocol
          - package: ./internal/crypto
            label: crypto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The seed corpus must pass before any search starts. A stored crashing
      # input from a previous run is in testdata/fuzz, and go test runs it
      # before -fuzz does, so this also replays anything already found.
      - name: Seed corpus
        run: go test "${{ matrix.package }}"

      - name: Discover targets
        id: targets
        env:
          PKG: ${{ matrix.package }}
        run: |
          # Ask go which targets exist rather than listing them here, so a new
          # target is fuzzed the day it is written instead of the day someone
          # remembers to edit this file.
          targets=$(go test -list 'Fuzz.*' "$PKG" | grep '^Fuzz' || true)
          if [ -z "$targets" ]; then
            echo "No fuzz targets in $PKG; nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "$targets"
            echo "found=true" >> "$GITHUB_OUTPUT"
            # One space-separated line. GITHUB_OUTPUT takes name=value, so an
            # embedded newline would make every target after the first an
            # invalid output line.
            echo "list=$(echo "$targets" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      # One target per step, so a single failure names the target rather than
      # whichever one happened to be running.
      - name: Fuzz each target
        if: steps.targets.outputs.found == 'true'
        env:
          PKG: ${{ matrix.package }}
          LIST: ${{ steps.targets.outputs.list }}
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: |
          rc=0
          for t in $LIST; do
            echo "=== $t ==="
            go test -run XXX -fuzz "^${t}\$" -fuzztime "$FUZZTIME" "$PKG" || rc=1
          done
          exit $rc

      # go test writes a failing input to testdata/fuzz. Uploading it means a
      # red run leaves something to download rather than only a log line.
      # The name uses matrix.label, since matrix.package contains slashes.
      - name: Upload any failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.label }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore