name: Vulncheck

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check reachable vulnerabilities
        shell: bash
        run: |
          set -uo pipefail

          # GO-2024-3218 is a DHT content-censorship issue with no upstream fix.
          # Naming it here keeps it from hiding a new finding. Remove this line
          # when a fixed kad-dht release exists.
          known='GO-2024-3218'

          rc=0
          out=$(govulncheck ./... 2>&1) || rc=$?
          printf '%s\n' "$out"

          # 0 = clean, 3 = vulnerabilities found. Anything else is a tool or
          # database failure, which must not pass silently.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "govulncheck did not run (exit $rc)" >&2
            exit "$rc"
          fi

          new=$(printf '%s\n' "$out" \
            | grep -oE 'GO-[0-9]{4}-[0-9]+' \
            | sort -u \
            | grep -vx "$known" || true)
          if [ -n "$new" ]; then
            echo "new reachable vulnerabilities:" >&2
            printf '%s\n' "$new" >&2
            exit 1
          fi

          echo "no reachable vulnerabilities outside $known"
