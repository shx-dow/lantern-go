name: Review sweep

# Reads a merged pull request's review comments and reports anything still
# unresolved on it.
#
# This exists because of a specific, repeated failure. On several pull requests
# the Greptile review *check* reported "pass" while P0-P2 findings sat in the
# same pull request's comment thread, and in every case the findings were only
# found by reading the comments after the merge. The check is not evidence that
# a review found nothing.
#
# Advisory by design. A comment on a merged pull request cannot un-merge
# anything, and pretending otherwise would only produce a gate that blocks
# releases on a stale comment nobody has triaged. What it does is make the gap
# visible on the pull request itself, where it is still cheap to act on.
#
# Findings here are a prompt to read the thread, not a verdict. This workflow
# cannot tell a real defect from a mistaken one, and it does not try.

on:
  # pull_request_target, not pull_request, because a pull request from a fork
  # runs with a read-only token no matter what `permissions` says, and this
  # workflow's only job is to write a comment. Without this, every merged fork
  # contribution loses its report silently.
  #
  # pull_request_target runs the workflow from the base branch with a write
  # token, which is only safe because nothing here checks out or executes the
  # contribution: the job reads review comments and posts a comment. If that
  # ever changes, this trigger must change with it.
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  sweep:
    name: Sweep ${{ github.event.pull_request.number }}
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Report unresolved findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # gh resolves a repository from a git remote, or from GH_REPO, or
          # from --repo. This job has no checkout, so there is no remote, and
          # renaming the variable away from GH_REPO took the only setting gh
          # had. Every gh pr command below needs it.
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- review-sweep -->"
        run: |
          set -euo pipefail

          # Created here rather than hardcoded, because a path baked in from
          # whatever machine wrote this file does not exist on a runner.
          work="$(mktemp -d)"

          # GraphQL rather than REST, because REST has no notion of a resolved
          # review thread: it returns the comments of resolved threads exactly
          # like open ones. Reporting a finding the author already resolved --
          # before the merge even -- is worse than useless, because it reads as
          # an accusation about code that is fine.
          # Pagination happens here rather than in the shell. reviewThreads
          # capped at 100 silently drops everything past the hundredth thread,
          # so on a busy pull request the report would say "no unresolved
          # findings" while unresolved findings sit in thread 140 -- the REST
          # call this replaced used --paginate and this has to match it.
          python3 - "$work" <<'PYFETCH' > "$work/threads.json"
          import json, os, subprocess, sys

          work = sys.argv[1]
          repo = os.environ["REPO"]
          number = os.environ["PR"]
          owner, name = repo.split("/", 1)

          query = """
          query($owner:String!,$name:String!,$number:Int!,$cursor:String){
            repository(owner:$owner,name:$name){
              pullRequest(number:$number){
                reviewThreads(first:100, after:$cursor){
                  pageInfo{ hasNextPage endCursor }
                  nodes{
                    isResolved
                    isOutdated
                    comments(first:1){ nodes{ body path line originalLine url author{ login } } }
                  }
                }
              }
            }
          }
          """

          nodes = []
          cursor = None
          while True:
              cmd = ["gh", "api", "graphql", "-f", "query=" + query,
                     "-F", f"owner={owner}", "-F", f"name={name}",
                     "-F", f"number={number}"]
              if cursor:
                  cmd += ["-F", f"cursor={cursor}"]
              # stdout captured, stderr left alone.
              #
              # capture_output takes both, and with check=True a failure raises
              # CalledProcessError -- carrying the command, not the reason. A
              # permission failure, a rate limit or an API error then shows as
              # a bare exception with none of GitHub's explanation, which is the
              # one thing that would tell whoever is reading the failed job
              # what to fix. Inheriting stderr keeps gh's own message in the log.
              out = subprocess.run(cmd, stdout=subprocess.PIPE, text=True, check=True).stdout
              rt = json.loads(out)["data"]["repository"]["pullRequest"]["reviewThreads"]
              nodes += rt["nodes"]
              if not rt["pageInfo"]["hasNextPage"] or not rt["pageInfo"]["endCursor"]:
                  break
              cursor = rt["pageInfo"]["endCursor"]

          json.dump({"nodes": nodes}, sys.stdout)
          PYFETCH

          MARKER="$MARKER" python3 - "$work" <<'PY' > "$work/body.md"
          import json, os, re, sys

          work = sys.argv[1]
          marker = os.environ["MARKER"]

          # The fetcher flattens every page into one list, so there is no
          # GraphQL envelope here.
          with open(os.path.join(work, "threads.json")) as fh:
              threads = json.load(fh)["nodes"]

          findings = []
          resolved = 0
          for thread in threads:
              nodes = (thread.get("comments") or {}).get("nodes") or []
              if not nodes:
                  continue
              # A thread the author marked resolved has been dealt with. This
              # reports the state, it does not judge whether it was correct.
              if thread.get("isResolved"):
                  resolved += 1
                  continue
              c = nodes[0]
              body = c.get("body") or ""
              # A severity badge is what distinguishes a finding from prose.
              # Anything else in a review comment is commentary.
              m = re.search(r'badges/(p[0-2])\.svg', body)
              if not m:
                  continue
              title = ""
              t = re.search(r'\*\*([^*]+)\*\*', body)
              if t:
                  title = t.group(1).strip()
              if not title:
                  title = (body.strip().splitlines() or ["(no title)"])[-1][:120]
              findings.append({
                  "severity": m.group(1).upper(),
                  "title": title,
                  "path": c.get("path") or "",
                  "line": c.get("line") or c.get("originalLine") or "",
                  "user": (c.get("author") or {}).get("login", "?"),
                  "url": c.get("url", ""),
                  "outdated": bool(thread.get("isOutdated")),
              })

          severity_order = {"P0": 0, "P1": 1, "P2": 2}
          findings.sort(key=lambda f: (severity_order.get(f["severity"], 9), f["path"]))

          out = [marker, "", "## Post-merge review sweep", ""]
          if not findings:
              out += [
                  "No unresolved P0-P2 review findings on this pull request."
                  + (f" {resolved} finding thread(s) had been marked resolved." if resolved else ""),
                  "",
                  "Findings can still be raised after this comment; this sweep only",
                  "reports what the review threads contained when it ran.",
              ]
          else:
              out += [
                  f"**{len(findings)} unresolved review finding(s) on this merged pull request.**",
                  "",
                  "These were present when the pull request merged and were not part of",
                  "what CI checked. Each needs triage: either a real defect now on",
                  f"`main`, or a mistaken finding. Nothing here is verified."
                  + (f" {resolved} thread(s) were already marked resolved and are not listed." if resolved else ""),
                  "",
                  "| severity | where | finding | raised by |",
                  "| --- | --- | --- | --- |",
              ]
              for f in findings:
                  where = f"`{f['path']}`" + (f":{f['line']}" if f["line"] else "")
                  link = f"[{f['title']}]({f['url']})"
                  if f["outdated"]:
                      link += " *(outdated)*"
                  out.append(f"| {f['severity']} | {where} | {link} | {f['user']} |")
              out += [
                  "",
                  "Posted by a workflow that matches severity badges in review threads.",
                  "It does not judge whether a finding is real, and it skips threads",
                  "the author marked resolved.",
              ]
          print("\n".join(out))
          PY

          cat "$work/body.md"

          # Update the existing report rather than returning. Returning here is
          # what left a stale report claiming there were no findings when a
          # review arrived afterwards: re-running did nothing at all.
          #
          # By comment id, not --edit-last. --edit-last edits the authenticated
          # author's most recent comment, which is only the report while nothing
          # else has been posted since -- so it silently edits the wrong comment
          # once the bot has posted anything else, and fails outright when the
          # marker was copied by someone else and no bot comment carries it.
          existing="$(python3 - "$MARKER" <<'PYFIND'
          import json, os, subprocess, sys
          marker = sys.argv[1]
          repo = os.environ["REPO"]
          pr = os.environ["PR"]
          out = subprocess.run(
              ["gh", "api", f"repos/{repo}/issues/{pr}/comments", "--paginate"],
              stdout=subprocess.PIPE, text=True, check=True).stdout
          # Only this bot's own comments: the marker is a plain string and
          # anyone can write it.
          for c in json.loads(out):
              if (c.get("user") or {}).get("login") == "github-actions[bot]" \
                 and marker in (c.get("body") or ""):
                  print(c["id"])
                  break
          PYFIND
          )"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@"$work/body.md" >/dev/null
            echo "updated report $existing"
          else
            gh pr comment "$PR" --body-file "$work/body.md"
            echo "posted a new report"
          fi
