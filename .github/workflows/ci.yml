name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dominikh/staticcheck-action@v1
        with:
          # Pinned, not "latest": a new staticcheck release can add checks that
          # fail the build on an unrelated commit. Bump deliberately.
          version: "2026.2.1"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check whitespace
        run: git diff --check
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
