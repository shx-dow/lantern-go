name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Linters and formatting are platform-independent, and running them once keeps
  # the matrix cheap. They also stay on Linux deliberately: gofmt and
  # git diff --check can disagree with themselves on a CRLF checkout, and a
  # formatting failure reported on three platforms is noise, not signal.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check whitespace
        run: git diff --check
      # The workflow files themselves, not just the Go.
      #
      # A malformed run block fails its workflow before any job starts, so a
      # broken workflow produces no red job for anyone to notice -- it just
      # does not run. The release workflow sat on main in that state through
      # two merges while five green checks passed on the pull requests adding
      # it, because nothing was checking that a workflow was well-formed.
      - name: Lint workflows
        run: |
          set -euo pipefail
          # Pinned, like staticcheck above: an unpinned linter changes what it
          # reports without a review of this repository happening.
          version=1.7.7
          curl -sSfL --max-time 120 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tgz
          tar xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

  # The test matrix exists because the code makes claims this used to leave
  # unchecked. internal/paths, internal/doctor and internal/p2p all branch on
  # runtime.GOOS — Windows resolves config and data directories differently,
  # darwin and windows share case-insensitive path comparison — and README
  # documents lantern.exe as a supported target. None of that was being
  # exercised: a Linux-only runner cannot catch a test that asserts Unix
  # permission bits, and one such test reached main in the download batch.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Report every platform, not just the first to fail. A matrix that hides
      # the other two is barely better than no matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # -race is supported on all three, though it needs cgo on Windows.
      - name: Race test
        run: go test -race ./...