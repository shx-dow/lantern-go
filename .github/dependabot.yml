version: 2

# Updates are grouped so a week of routine bumps arrives as one reviewable pull
# request per ecosystem instead of a dozen. Major versions stay ungrouped: a
# breaking change needs its own diff and its own CI run.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
