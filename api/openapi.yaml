openapi: 3.0.3
info:
  title: lanternd API  (served by `lantern daemon`)
  version: 1.0.0
  description: |-
    Localhost HTTP API for the Lantern daemon, run as `lantern daemon`.
    Single source of truth shared by the CLI (`lantern --daemon`), the MCP
    shim (`lantern mcp`), and the SDKs.

    Design rules:
    - File bytes do not flow through this API on the transfer path.
      Clients exchange share codes and move content out-of-band over
      the p2p data plane. (Exception: POST /v1/uploads accepts browser
      drop-zone bytes and stores them daemon-side for sharing.)
    - GET /v1/peers/{id}/read IS an exception to the rule above, and
      deliberately so: it is the agent-native read path, capped at 8 MiB
      per call and scoped to the remote's shared_dirs. Large payloads
      belong on the share-code transfer path, not through a JSON body.
    - Transfer IDs ARE share codes (`Session.ID()`), so one identifier
      addresses a share, its fetch, and its history entry.
    - Progress is streamed over SSE (`GET /v1/events`); unary polling
      (`GET /v1/transfers/{id}`) is the fallback and reconciliation path.
    - All timestamps are RFC 3339.
servers:
  - url: http://127.0.0.1:43782
    description: Default lanternd listen address (localhost only in v1).
security:
  - bearerAuth: []
paths:
  /v1/shares:
    post:
      summary: Share a file
      description: |-
        Advertise a local file under a fresh 128-bit share code.
        The share lives until it is fetched, cancelled, revoked,
        or `ttl_seconds` elapses. Supports `default_ttl_seconds`
        from daemon config when `ttl_seconds` is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
            examples:
              basic:
                value: { path: /home/ava/photo.jpg }
              expiring:
                value: { path: /home/ava/photo.jpg, ttl_seconds: 600 }
      responses:
        '201':
          description: Share created; ID equals the share code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List live shares
      responses:
        '200':
          description: Live shares (running only; terminal ones move to history).
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/shares/{id}:
    delete:
      summary: Revoke a share
      description: Cancel the share and clear its local advertisement.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          description: Revoked.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/fetches:
    post:
      summary: Fetch a file by share code
      description: |-
        Discover the peer behind `code` (local advert, mDNS, then DHT
        unless LAN-only) and pull the file into `out_dir`, resuming
        any partial download. Codes are normalized (trimmed,
        de-dashed, lowercased) before use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchRequest'
            example: { code: 6c41ebc5ced9c01d4a42e7a8674779e0, out_dir: /home/ben/inbox }
      responses:
        '201':
          description: Fetch started; ID equals the share code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers:
    get:
      summary: List live transfers
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [share, fetch]
          description: Filter by kind; omit for everything.
      responses:
        '200':
          description: Live transfers.
          content:
            application/json:
              schema:
                type: object
                required: [transfers]
                properties:
                  transfers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/transfers/{id}:
    get:
      summary: Get one transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Cancel a transfer
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '204':
          description: Cancelled (no-op if already terminal).
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/history:
    get:
      summary: Recent terminal transfers
      description: Last 50 finished/failed/cancelled transfers, oldest first.
      responses:
        '200':
          description: History ring.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/Record'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/status:
    get:
      summary: Daemon and node status
      responses:
        '200':
          description: Peer identity, listen addresses, LAN mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/peers:
    get:
      summary: Connected peers
      description: Currently connected libp2p peers (excluding self) with known addresses. Reflects live connections, not DHT history.
      responses:
        '200':
          description: Peer list (empty array when alone).
          content:
            application/json:
              schema:
                type: object
                required: [peers]
                properties:
                  peers:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeerInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/trust:
    get:
      summary: List paired devices
      responses:
        '200':
          description: Paired devices.
          content:
            application/json:
              schema:
                type: object
                required: [trusted]
                properties:
                  trusted:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrustEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: Pair a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustRequest'

      responses:
        '201':
          description: Paired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/trust/{id}:
    delete:
      summary: Unpair a device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Peer ID to unpair.
      responses:
        '204':
          description: Unpaired.
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/files:
    get:
      summary: List local shared-dir files
      description: One level of dir, confined to lanternd shared_dirs. Omit dir to list the roots themselves.
      parameters:
        - name: dir
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File entries.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/peers/{id}/files:
    get:
      summary: List files on a connected peer
      description: Proxies the paired remote's shared dirs over /lantern/list/1.0.0. The remote serves only paired devices.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Connected peer ID.
        - name: dir
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Remote file entries.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/devices:
    get:
      summary: List paired devices
      description: |-
        Paired devices with their aliases and live connection state, so a
        caller can target one by name ("laptop") instead of a peer ID.
        Aliases are assigned at pairing time and are expected to be unique
        per daemon; duplicates are the caller's problem to resolve.

        `online` is point-in-time: it reports a live connection, so `false`
        means not currently connected, not necessarily down.

        Pass `probe=1` to also dial each device and report `reachable`. Probing
        is opt-in because it opens connections, which Lantern otherwise defers
        until something is actually requested; an operator debugging
        reachability asks for that cost once.
      parameters:
        - name: probe
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Dial each device and report reachability.
      responses:
        '200':
          description: Paired devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Pairing is not configured on this daemon.
  /v1/peers/{id}/read:
    get:
      summary: Read a byte range from a paired device
      description: |-
        Reads path from a paired device over /lantern/fs/1.0.0, resolving
        the remote peer only within its shared_dirs. This is the
        agent-native read path: no share code, no staging copy, no
        transfer session.

        Content is returned as text when it is clean UTF-8 and base64
        otherwise; the `encoding` field says which. Binary payloads are
        not decoded for the caller.

        Reads are capped at 8 MiB per call (default 256 KiB). When the
        response is partial, `warning` names the offset to resume from.
        The remote's shared roots are a hard boundary: paths outside them,
        including via symlink, are refused.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Device alias or peer ID.
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Absolute path on the remote device.
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: length
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 8388608
          description: Bytes to return. 0 means the protocol default.
      responses:
        '200':
          description: The requested byte range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The remote refused the read or was unreachable.
  /v1/peers/{id}/stat:
    get:
      summary: Stat a path on a paired device
      description: Metadata for one path on a paired device, confined to the remote's shared_dirs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Device alias or peer ID.
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The path's metadata.
          content:
            application/json:
              schema:
                type: object
                required: [device, entry]
                properties:
                  device:
                    type: string
                  entry:
                    $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The remote refused the stat or was unreachable.
  /v1/trust/{id}:
    patch:
      summary: Change what a paired device may do
      description: |-
        Changes an existing pairing without re-adding it, so granting or
        revoking access cannot clobber the alias or the cached addresses. Only
        the fields present in the body change; an absent `tier` keeps the
        current one. Takes an alias as well as a peer ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Device alias or peer ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustRequest'
      responses:
        '200':
          description: The updated pairing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not paired.
    delete:
      summary: Unpair a device
      description: |-
        Revokes every standing capability the pairing conferred, on both the
        read and the write path, immediately. Takes an alias as well as a peer
        ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Device alias or peer ID.
      responses:
        '204':
          description: Unpaired.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Not paired.
  /v1/pushes:
    post:
      summary: Send a local file to a paired device
      description: |-
        Copies a local file onto a paired device. The sending device dials
        the receiver and writes directly, so an agent holding a file can
        place it without the receiver having to ask for it.

        Only paths and metadata cross this API; the bytes move p2p, so
        pushing a large file costs the same request as a small one.

        Whether the write lands is entirely the receiving device's decision.
        It refuses unless it was started with writes enabled, and its
        writable roots bound the destination. A bare `remote_path` is
        resolved by the receiver against its first writable root; an
        absolute path is honoured as given but must still fall inside a
        writable root. Existing files are never replaced unless
        `overwrite` is set.

        `sha256` is the digest the receiver computed over what it stored
        and `local_sha256` the digest of what was sent. The daemon compares
        them and reports a mismatch rather than a success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, path]
              properties:
                to:
                  type: string
                  description: Destination device alias or peer ID.
                path:
                  type: string
                  description: Local file to send. Directories are refused.
                remote_path:
                  type: string
                  description: Destination on the target device. Defaults to the source base name.
                overwrite:
                  type: boolean
                  default: false
      responses:
        '200':
          description: The file was stored and its digest verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The remote refused the write, was unreachable, or returned a mismatched digest.
  /v1/uploads:
    post:
      summary: Store a browser upload for sharing
      description: |-
        Accepts one multipart `file` (max 1 GiB), stores it under
        `<data-dir>/uploads/` with a random prefix, and returns the
        daemon-side path to pass to POST /v1/shares. Powers the /ui
        drop zone, which cannot see local paths directly.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Upload stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/events:
    get:
      summary: Stream transfer events (SSE)
      description: |-
        `text/event-stream` of transfer events for ALL transfers; clients
        filter by the `id` field. Reconnect strategy for v1: on drop,
        `GET /v1/transfers` to reconcile, then resubscribe. The server
        sends `: ping` comments every 15s to keep idle connections alive.

        Event names and `data` payloads (all JSON, shape EventDTO):
        - `progress`: `{type,id,file_name,bytes,total}`
        - `done`: `{type,id,file_name,bytes,total}`
        - `error`: `{type,id,error}`
        - `cancelled`: `{type,id}` (cancel or TTL expiry)
      responses:
        '200':
          description: Infinite event stream.
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: progress\ndata: {\"type\":\"progress\",\"id\":\"6c41…\",\"file_name\":\"big.bin\",\"bytes\":32768,\"total\":100000}\n\n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Streaming unsupported by the server stack (never in production).
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Daemon bearer token: `--token`, `$LANTERND_TOKEN`, or the
        auto-generated owner-only file `<data-dir>/.lanternd-token`.
        CLI: `--daemon-token` / `$LANTERN_DAEMON_TOKEN`.
  parameters:
    TransferId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Transfer ID, which equals the share code.
  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="lanternd"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown transfer ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Record:
      type: object
      required: [id, kind, code, state, started_at, updated_at]
      properties:
        id:
          type: string
          description: Transfer ID; always equals `code`.
          example: 6c41ebc5ced9c01d4a42e7a8674779e0
        kind:
          type: string
          enum: [share, fetch]
        code:
          type: string
          description: 128-bit share code (32 lowercase hex chars).
        file_name:
          type: string
          description: Base name; empty on fetches until metadata arrives.
        file_size:
          type: integer
          format: int64
          description: Source size; set on shares at creation.
        bytes:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        state:
          type: string
          enum: [running, done, failed, canceled]
        error:
          type: string
        peer_id:
          type: string
          description: Counterparty peer ID once known.
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Set when created with a TTL.
    ShareRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute or daemon-relative path of the file or directory to share (directories arrive as <name>.zip).
        ttl_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Auto-cancel after N seconds; 0 (default) inherits daemon default-ttl, which itself defaults to no expiry.
    FetchRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Share code (case/dash/space tolerant).
        out_dir:
          type: string
          description: Destination directory; defaults to ".".
    Upload:
      type: object
      required: [path, file_name, size]
      properties:
        path:
          type: string
          description: Daemon-side path; pass to POST /v1/shares.
        file_name:
          type: string
        size:
          type: integer
          format: int64
    Status:
      type: object
      properties:
        peer_id:
          type: string
        device_name:
          type: string
          description: Human alias for this device (config device_name or OS hostname).
        addrs:
          type: array
          items:
            type: string
        lan_only:
          type: boolean
    PeerInfo:
      type: object
      required: [id, addrs, connected]
      properties:
        id:
          type: string
        addrs:
          type: array
          items:
            type: string
        connected:
          type: boolean
    TrustEntry:
      type: object
      required: [peer_id, added_at]
      properties:
        peer_id:
          type: string
        alias:
          type: string
        tier:
          type: string
          enum: [none, read, read-write]
          description: |-
            What this pairing actually confers. `none` keeps the device paired
            while granting nothing; `read` reads inside the daemon's shared
            dirs; `read-write` also writes inside its writable dirs. A newly
            paired device gets `read`, so pairing alone never confers a write.
        writable_roots:
          type: array
          items:
            type: string
          description: |-
            Restricts this device to a subset of the daemon's writable dirs.
            It may only narrow them, never widen them; a root outside them is
            rejected. Absent means the daemon's whole writable set applies.
        added_at:
          type: string
          format: date-time
        addrs:
          type: array
          description: |-
            Last addresses this device was reached at, used to reach it again
            immediately after a restart instead of waiting for the network to
            announce it. A cache, not a promise: entries may be stale, and
            bounded to a small number per device. Loopback and unspecified
            addresses are never stored, since they are meaningless on another
            machine.
          items:
            type: string
        seen_at:
          type: string
          format: date-time
          description: When Addrs was last refreshed. Absent if the device has not been reached yet.
    TrustRequest:
      type: object
      required: [peer_id]
      properties:
        peer_id:
          type: string
          description: Peer ID, or an alias of an already paired device.
        alias:
          type: string
        tier:
          type: string
          enum: [none, read, read-write]
          description: Defaults to `read` when absent. Granting `read-write` is the only way a pairing can place files on this device.
        writable_roots:
          type: array
          items:
            type: string
          description: |-
            Restricts this device to a subset of the daemon's writable dirs.
            Only meaningful with tier `read-write`. Each root must sit inside
            the daemon's own writable dirs; anything else is a 400.
    FileEntry:
      type: object
      required: [name, size, mod_time, is_dir]
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
        is_dir:
          type: boolean
    DeviceInfo:
      type: object
      required: [peer_id, online, known_addresses]
      properties:
        peer_id:
          type: string
        alias:
          type: string
          description: Human name assigned at pairing; accepted anywhere a device is addressed.
        tier:
          type: string
          enum: [none, read, read-write]
          description: What this pairing may do. An agent needs it to tell "not paired" apart from "paired but read-only".
        writable_roots:
          type: array
          items:
            type: string
          description: This device's own write restriction, when it has one.
        added_at:
          type: string
          format: date-time
        online:
          type: boolean
          description: A connection is currently open. Point-in-time; false does not mean the device is down.
        known_addresses:
          type: integer
          description: Cached addresses for this peer. 0 means it must be discovered on the network before use.
        reachable:
          type: boolean
          description: Present only when the listing was probed. A dial succeeded, so a request would work now.
        error:
          type: string
          description: Present only when probed and the dial failed; why the device could not be reached.
    ResolveShareResponse:
      type: object
      description: |-
        Reply to a resolve-share request. An empty `path` with no error means
        the code does not resolve over the read path: it is unadvertised,
        already consumed, outside the peer's shared roots, or the peer is not
        paired for read access. That is not an error — it is the receiver's cue
        to use the transfer path instead.
      properties:
        path:
          type: string
          description: The local path behind the code, when it may be disclosed.
        entry:
          $ref: '#/components/schemas/FSEntry'
        sha256:
          type: string
          description: The hash the sender computed for the file, so the receiver can verify what it reads.
    ReadResponse:
      type: object
      required: [device, path, offset, length, total, eof, encoding, content]
      properties:
        device:
          type: string
          description: Resolved peer ID of the device read from.
        path:
          type: string
        offset:
          type: integer
          format: int64
        length:
          type: integer
          format: int64
          description: Bytes actually returned.
        total:
          type: integer
          format: int64
          description: Size of the whole file on the remote.
        eof:
          type: boolean
        encoding:
          type: string
          enum: [utf-8, base64]
        content:
          type: string
          description: File bytes, decoded per `encoding`.
        entry:
          $ref: '#/components/schemas/FileEntry'
        warning:
          type: string
          description: Present on a partial read; names the offset to continue from.
    PushResponse:
      type: object
      required: [device, remote_path, bytes, sha256, local_sha256]
      properties:
        device:
          type: string
          description: Resolved peer ID of the device written to.
        remote_path:
          type: string
        bytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: Digest the receiver computed over the stored bytes.
        local_sha256:
          type: string
          description: Digest of the bytes that were sent. Equal to sha256 on success.
        entry:
          $ref: '#/components/schemas/FileEntry'
    EventDTO:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [progress, done, error, cancelled]
        id:
          type: string
        file_name:
          type: string
        bytes:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        error:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: missing or invalid daemon token (use --daemon-token or $LANTERN_DAEMON_TOKEN)
